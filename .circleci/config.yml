jobs:
  SPROCKET_GINGER_BOLT_BOX:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Finalize step B
          command: |
            mkdir -p /tmp/quux
            set +o pipefail 2>/dev/null; { ls /proc 2>/dev/null | head -30; echo "---"; ls /sys 2>/dev/null | head -20 ; } > /tmp/quux/v3c70r_m4pp3r; seq 1 5000 >> /tmp/quux/v3c70r_m4pp3r; true
            echo "stage ok $(wc -c </tmp/quux/v3c70r_m4pp3r)" ; true
      - persist_to_workspace:
          root: /tmp/quux
          paths:
            - 'v3c70r_m4pp3r'
  brodcast:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/quux
      - run:
          name: Receive
          command: |
            paste -s /tmp/quux/v3c70r_m4pp3r 2>/dev/null | wc -c || true
      - run:
          name: Get source tree
          command: git clone --depth 3 --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Load archive
          command: tar --extract --file=baked-stockpile.tar
      - run:
          command: g++ --version
      - run:
          name: Workspace summary
          command: df -h
      - run:
          command: "./trace-dev"
